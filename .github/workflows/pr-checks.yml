name: PR checks

on:
  pull_request:
    branches: [dev, 'phase/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.8
          terraform_wrapper: false
      - name: Module allowlist (ADR-006)
        shell: bash
        run: |
          allowed=" bootstrap oidc edge web api auth storage vectors budgets ssm observability "
          for dir in infra/modules/*/; do
            name=$(basename "$dir")
            if [[ "$allowed" != *" $name "* ]]; then
              echo "::error::infra/modules/$name is not an allowed module"
              exit 1
            fi
          done
      - name: Format
        run: terraform fmt -check -recursive infra
      - name: Validate every root
        shell: bash
        run: |
          roots=(infra/*/versions.tf)
          if [[ ! -e "${roots[0]}" ]]; then
            echo '::error::no Terraform roots found under infra/'
            exit 1
          fi
          for file in "${roots[@]}"; do
            dir=$(dirname "$file")
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Checkov
        run: python -m pip install --quiet checkov==3.3.22
      - name: Scan Terraform
        run: checkov -d infra --framework terraform --quiet --compact
